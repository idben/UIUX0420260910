<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .ball{
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #ed8c8c;
    }
    .rect{
      position: absolute;
      right: 50px;
      top: 50px;
      width: 150px;
      height: 80px;
      background-color: #9e9d9d;
      display: grid;
      place-items: center;
    }
  </style>
  <title>Drag and Drop 1</title>
</head>
<body>
  <div class="ball" draggable="true"></div>
  <div class="rect">拖到這裡來</div>

  <script>
    const ball = document.querySelector(".ball");
    const rect = document.querySelector(".rect");

    rect.addEventListener("dragover", (event) => {
      event.preventDefault();
    });
    rect.addEventListener("drop", (event) => {
      event.preventDefault();
    });
  </script>
</body>
</html>
