<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .ball{
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #ed8c8c;
      &:nth-child(2){
        background-color: #a6f604;
      }
      &:nth-child(3){
        background-color: #02b4e5;
      }
    }
    .rect{
      position: absolute;
      right: 50px;
      top: 50px;
      width: 150px;
      height: 80px;
      background-color: #9e9d9d;
      display: grid;
      place-items: center;
    }
  </style>
  <title>Drag and Drop 1</title>
</head>
<body>
  <div class="ball" draggable="true" data-color="#ed8c8c"></div>
  <div class="ball" draggable="true" data-color="#a6f604"></div>
  <div class="ball" draggable="true" data-color="#02b4e5"></div>
  <div class="rect">拖到這裡來</div>

  <script>
    const balls = document.querySelectorAll(".ball");
    const rect = document.querySelector(".rect");

    balls.forEach((ball)=>{
      ball.addEventListener("dragstart", (event) => {
        const color =  event.target.dataset.color;
        console.log(color);
        event.dataTransfer.setData("text/plain", color)
      });
    });



    rect.addEventListener("dragover", (event) => {
      event.preventDefault();
    });
    rect.addEventListener("drop", (event) => {
      event.preventDefault();
      const data = event.dataTransfer.getData("text");
      console.log(data);
      event.target.style.backgroundColor = data;
    });
  </script>
</body>
</html>
