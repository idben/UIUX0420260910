<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      height: 100vh;
    }
    .btn{
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      margin: auto;
      /* width: fit-content;
      height: fit-content; */
      width: 100px;
      height: 40px;
      background-color: #1098f9;
      color: #ffffff;
      text-align: center;
      line-height: 40px;
      border-radius: 4px;
      user-select: none;
      cursor: pointer;
      font-family: sans-serif;
      transition: all 0.2s;

      &:hover{
        width: 130px;
        height: 60px;
        line-height: 60px;
      }
    }
  </style>
  <title>transition 1</title>
</head>
<body>
  <div class="btn">按鈕 1</div>
</body>
</html>
