<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .box{
      position: relative;
      width: 100px;
      height: 100px;
      background-color: #1496f2;
      animation-name: ani1;
      animation-duration: 2s;
      animation-iteration-count: infinite;
    }

    @keyframes ani1{
      0%{
        left: 0;
      }
      50%{
        left: calc(100% - 100px);
      }
      100%{
        left: 0;
      }
    }
  </style>
  <title>animation 1</title>
</head>
<body>
  <div class="box"></div>
</body>
</html>
